services:
  zai2api:
    build: .
    image: zai2api:latest
    container_name: zai2api
    restart: unless-stopped
    # host network: the browser session dials the mihomo proxy on
    # 127.0.0.1:7890 which lives on the host
    network_mode: host
    env_file:
      - .env
    environment:
      - DATA_DIR=/app/data
      - MOZ_DISABLE_CONTENT_SANDBOX=1
    volumes:
      - ./data:/app/data
    shm_size: "256m"
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_ADMIN
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
